name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Start services
        run: docker compose -f docker/docker-compose.yaml up -d --build

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API (http://localhost:8080)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "API is ready after $((i * 10))s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API did not start in time"
              docker compose -f docker/docker-compose.yaml logs app
              exit 1
            fi
            sleep 10
          done

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend (http://localhost:3000)..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "Frontend did not start in time"
              docker compose -f docker/docker-compose.yaml logs frontend
              exit 1
            fi
            sleep 5
          done

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yaml down
